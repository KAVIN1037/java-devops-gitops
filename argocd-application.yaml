apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-devops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KAVIN1037/java-devops-gitops.git
    targetRevision: main
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
